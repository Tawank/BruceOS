---
name: Build and Push OR check-PR

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

on:
  pull_request:
    branches:
      - main
      - dev
    paths:
      - "**.c"
      - "**.h"
      - "**.cpp"
      - "**.py"
      - "**.yml"
      - "**.yaml"
      - "**.json"
      - "**.cmake"
      - "CMakeLists.txt"
      - "sdkconfig.defaults*"
      - "boards/**"
      - "native_apps/**"
  workflow_dispatch:

defaults:
  run:
    shell: bash

env:
  IDF_COMPONENT_CACHE_PATH: /tmp/idf-component-cache

jobs:
  firmware:
    name: Build ${{ matrix.board }}
    runs-on: ubuntu-latest
    container: espressif/idf:v6.0.2
    strategy:
      fail-fast: false
      matrix:
        board:
          - "m5stack-cardputer"
          - "m5stack-cplus2"
          - "m5stack-core2"
          - "m5stack-sticks3"
          - "lilygo-t-embed"
          - "lilygo-t-display-ttgo"
    steps:
      - uses: actions/checkout@v4
      - run: source "$IDF_PATH/export.sh" && python3 tools/board.py ${{ matrix.board }} build
      - uses: actions/upload-artifact@v4
        with:
          name: BruceIDF-${{ matrix.board }}
          path: build-board/${{ matrix.board }}/BruceIDF.bin
          retention-days: 5
          if-no-files-found: error
