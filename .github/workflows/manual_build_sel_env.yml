name: Manual Build (Select Environment)
# All credits to Ninja-Jr @ninjajr
on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: 'Branch to build from'
        required: true
        default: 'main'
        type: string
      environment:
        description: 'Select environment to build'
        required: true
        default: 'm5stack-cardputer'
        type: choice
        options:
          - "m5stack-cardputer"
          - "m5stack-cardputer-adv"
          - "m5stack-cplus2"
          - "m5stack-cplus1_1"
          - "m5stack-core"
          - "m5stack-core2"
          - "m5stack-cores3"
          - "m5stack-dinmeter"
          - "m5stack-sticks3"
          - "lilygo-t-embed-cc1101"
          - "lilygo-t-embed"
          - "lilygo-t-display-s3"
          - "lilygo-t-display-ttgo"
          - "xk404"

jobs:
  firmware:
    name: Build ${{ inputs.environment }}
    runs-on: ubuntu-latest
    container: espressif/idf:v6.0.2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_branch }}
      - run: source "$IDF_PATH/export.sh" && python3 tools/board.py ${{ inputs.environment }} build
      - name: Stage flash files
        run: |
          mkdir release-assets
          cp build-board/${{ inputs.environment }}/BruceIDF.bin release-assets/BruceIDF-${{ inputs.environment }}.bin
          cp build-board/${{ inputs.environment }}/bootloader/bootloader.bin release-assets/BruceIDF-${{ inputs.environment }}-bootloader.bin
          cp build-board/${{ inputs.environment }}/partition_table/partition-table.bin release-assets/BruceIDF-${{ inputs.environment }}-partition-table.bin
          cp build-board/${{ inputs.environment }}/flasher_args.json release-assets/BruceIDF-${{ inputs.environment }}-flasher_args.json
      - uses: actions/upload-artifact@v4
        with:
          name: BruceIDF-${{ inputs.environment }}
          path: release-assets/
          retention-days: 5
          if-no-files-found: error
