name: Manual Build (Select Environment)
# All credits to Ninja-Jr @ninjajr
on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: 'Branch to build from'
        required: true
        default: 'main'
        type: string
      environment:
        description: 'Select environment to build'
        required: true
        default: 'm5stack-cardputer'
        type: choice
        options:
          - "m5stack-cardputer"
          - "m5stack-cardputer-adv"
          - "m5stack-cplus2"
          - "m5stack-cplus1_1"
          - "m5stack-core"
          - "m5stack-core2"
          - "m5stack-cores3"
          - "m5stack-dinmeter"
          - "m5stack-sticks3"
          - "lilygo-t-embed-cc1101"
          - "lilygo-t-embed"
          - "lilygo-t-display-s3"
          - "lilygo-t-display-ttgo"
          - "xk404"

defaults:
  run:
    shell: bash

jobs:
  firmware:
    name: Build ${{ inputs.environment }}
    runs-on: ubuntu-latest
    container: espressif/idf:v6.0.2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_branch }}
      - run: source "$IDF_PATH/export.sh" && python3 tools/board.py ${{ inputs.environment }} build
      - name: Stage flash files
        run: |
          mkdir release-assets
          source "$IDF_PATH/export.sh"
          chip=$(tr -d '[:space:]' < boards/${{ inputs.environment }}/target)
          build_dir=build-board/${{ inputs.environment }}
          read -r flash_mode flash_freq flash_size < <(python3 -c 'import json, sys; settings = json.load(open(sys.argv[1]))["flash_settings"]; print(settings["flash_mode"], settings["flash_freq"], settings["flash_size"])' "$build_dir/flasher_args.json")
          [[ "$flash_size" == "detect" ]] && flash_size=keep
          flash_args=()
          while read -r offset file; do
            flash_args+=("$offset" "$build_dir/$file")
          done < <(python3 -c 'import json, sys; print("\n".join(f"{offset} {path}" for offset, path in sorted(json.load(open(sys.argv[1]))["flash_files"].items(), key=lambda item: int(item[0], 0))))' "$build_dir/flasher_args.json")
          python3 -m esptool --chip "$chip" merge-bin --format raw -o release-assets/BruceOS-${{ inputs.environment }}.bin \
            --flash-mode "$flash_mode" --flash-freq "$flash_freq" --flash-size "$flash_size" "${flash_args[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: BruceOS-${{ inputs.environment }}
          path: release-assets/
          retention-days: 5
          if-no-files-found: error
