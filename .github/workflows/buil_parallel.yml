---
name: Build and Push Releases

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
      - dev

    paths:
      - "**.yml"
      - "**.h"
      - "**.c"
      - "**.cpp"
      - "**.py"
      - "**.html"
      - "**.css"
      - "**.js"
      - "**.ini"
      - "**.json"
      - "**.cmake"
      - "CMakeLists.txt"
      - "sdkconfig.defaults*"
      - "boards/**"
      - "native_apps/**"
    tags:
      - "*"
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  firmware:
    name: Build ${{ matrix.board }}
    runs-on: ubuntu-latest
    container: espressif/idf:v6.0.2
    strategy:
      fail-fast: false
      matrix:
        board:
          - "m5stack-cardputer"
          - "m5stack-cardputer-adv"
          - "m5stack-cplus2"
          - "m5stack-cplus1_1"
          - "m5stack-core"
          - "m5stack-core2"
          - "m5stack-cores3"
          - "m5stack-dinmeter"
          - "m5stack-sticks3"
          - "lilygo-t-embed-cc1101"
          - "lilygo-t-embed"
          - "lilygo-t-display-s3"
          - "lilygo-t-display-ttgo"
          - "xk404"
    steps:
      - uses: actions/checkout@v4
      - name: Build firmware
        run: source "$IDF_PATH/export.sh" && python3 tools/board.py ${{ matrix.board }} build
      - name: Report managed component hash
        if: failure()
        run: |
          source "$IDF_PATH/export.sh"
          python3 -c 'from idf_component_tools.hash_tools.calculate import hash_dir; print(hash_dir("managed_components/wasm-micro-runtime"))'
          cat managed_components/wasm-micro-runtime/.component_hash
      - name: Stage flash files
        run: |
          mkdir release-assets
          source "$IDF_PATH/export.sh"
          chip=$(tr -d '[:space:]' < boards/${{ matrix.board }}/target)
          build_dir=build-board/${{ matrix.board }}
          read -r flash_mode flash_freq flash_size < <(python3 -c 'import json, sys; settings = json.load(open(sys.argv[1]))["flash_settings"]; print(settings["flash_mode"], settings["flash_freq"], settings["flash_size"])' "$build_dir/flasher_args.json")
          [[ "$flash_size" == "detect" ]] && flash_size=keep
          flash_args=()
          while read -r offset file; do
            flash_args+=("$offset" "$build_dir/$file")
          done < <(python3 -c 'import json, sys; print("\n".join(f"{offset} {path}" for offset, path in sorted(json.load(open(sys.argv[1]))["flash_files"].items(), key=lambda item: int(item[0], 0))))' "$build_dir/flasher_args.json")
          python3 -m esptool --chip "$chip" merge-bin --format raw -o release-assets/BruceOS-${{ matrix.board }}.bin \
            --flash-mode "$flash_mode" --flash-freq "$flash_freq" --flash-size "$flash_size" "${flash_args[@]}"
      - name: Upload ${{ matrix.board }} firmware
        uses: actions/upload-artifact@v4
        with:
          name: BruceOS-${{ matrix.board }}
          path: release-assets/
          retention-days: 5
          if-no-files-found: error

  native_packages:
    name: Build native apps and modules
    runs-on: ubuntu-latest
    container: espressif/idf:v6.0.2
    steps:
      - uses: actions/checkout@v4
      - name: Install WASM compiler
        run: apt-get update && apt-get install -y --no-install-recommends clang lld
      - name: Build external application ELFs
        run: source "$IDF_PATH/export.sh" && python3 native_apps/tools/build_apps.py --target elf --idf-target esp32s3
      - name: Build module ELFs
        run: source "$IDF_PATH/export.sh" && python3 native_apps/tools/build_modules.py --target elf --idf-target esp32s3
      - name: Build WASM modules
        run: source "$IDF_PATH/export.sh" && python3 native_apps/tools/build_modules.py --target wasm
      - name: Stage native packages
        run: |
          mkdir release-assets
          cp native_apps/examples/*_esp32s3.elf release-assets/
          cp native_apps/build_modules/*.elf release-assets/
          cp native_apps/build_modules/*.wasm release-assets/
      - name: Upload native packages
        uses: actions/upload-artifact@v4
        with:
          name: BruceOS-native-packages
          path: release-assets/
          retention-days: 5
          if-no-files-found: error

  rolling_releases:
    name: Update rolling releases
    runs-on: ubuntu-latest
    environment: github_release
    needs: [firmware, native_packages]
    steps:
      - name: Download build assets
        uses: actions/download-artifact@v4
        with:
          pattern: BruceOS-*
          merge-multiple: true
          path: artifacts
      - name: Ensure rolling releases exist
        id: releases
        uses: actions/github-script@v7
        with:
          script: |
            const ensure = async (tag) => {
              try {
                return (await github.rest.repos.getReleaseByTag({ owner: context.repo.owner, repo: context.repo.repo, tag })).data.id;
              } catch (error) {
                if (error.status !== 404) throw error;
                return (await github.rest.repos.createRelease({ owner: context.repo.owner, repo: context.repo.repo, tag_name: tag, name: tag, prerelease: true })).data.id;
              }
            };
            core.setOutput('beta', await ensure('betaRelease'));
            core.setOutput('last', await ensure('lastRelease'));
      - name: Replace beta assets
        uses: actions/github-script@v7
        with:
          script: |
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, { owner: context.repo.owner, repo: context.repo.repo, release_id: ${{ steps.releases.outputs.beta }} });
            await Promise.all(assets.map(asset => github.rest.repos.deleteReleaseAsset({ owner: context.repo.owner, repo: context.repo.repo, asset_id: asset.id })));
      - name: Upload beta assets
        uses: softprops/action-gh-release@v2
        with:
          name: betaRelease commit (${{ github.sha }})
          tag_name: betaRelease
          prerelease: true
          make_latest: false
          files: artifacts/*
      - name: Replace last-release assets
        if: github.ref_type == 'tag'
        uses: actions/github-script@v7
        with:
          script: |
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, { owner: context.repo.owner, repo: context.repo.repo, release_id: ${{ steps.releases.outputs.last }} });
            await Promise.all(assets.map(asset => github.rest.repos.deleteReleaseAsset({ owner: context.repo.owner, repo: context.repo.repo, asset_id: asset.id })));
      - name: Upload last-release assets
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: lastRelease commit (${{ github.sha }})
          tag_name: lastRelease
          prerelease: true
          make_latest: false
          files: artifacts/*
      # Web-page deployment is intentionally disabled for this unofficial build.
      # - run: gh workflow run .github/workflows/deploy.yml --ref WebPage

  release:
    name: Create tagged release
    runs-on: ubuntu-latest
    environment: github_release
    needs: [firmware, native_packages]
    if: github.ref_type == 'tag'
    steps:
      - name: Download build assets
        uses: actions/download-artifact@v4
        with:
          pattern: BruceOS-*
          merge-multiple: true
          path: artifacts
      - name: Publish ${{ github.ref_name }}
        uses: softprops/action-gh-release@v2
        with:
          name: BruceOS Release ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: artifacts/*
