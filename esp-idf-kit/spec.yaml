schemaVersion: "1"
kind: mixin
name: esp-idf-kit

commands:
  install:
    - description: Install ESP-IDF prerequisites
      command: |
        apt-get update
        apt-get install -y \
          git wget curl flex bison gperf cmake ninja-build \
          ccache libffi-dev libssl-dev dfu-util \
          libusb-1.0-0 python3 python3-pip python3-venv
      user: 0

    - description: Clone ESP-IDF v6.0.2
      command: |
        git clone \
          --branch v6.0.2 \
          --depth 1 \
          --recursive \
          https://github.com/espressif/esp-idf.git \
          /opt/esp/idf
      user: 0

    - description: Install ESP-IDF tools
      command: |
        export IDF_PATH=/opt/esp/idf
        export IDF_TOOLS_PATH=/opt/esp
        /opt/esp/idf/install.sh all
      user: 0

  startup:
    - description: Add ESP-IDF export to bashrc
      command: ["source /opt/esp/idf/export.sh"]
      user: 1000
