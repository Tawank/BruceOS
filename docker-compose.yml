services:
  esp-idf:
    build:
      context: .
      dockerfile: Dockerfile.esp-idf

    image: bruce-esp-idf:6.0.2
    working_dir: /workspace

    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"

    volumes:
      - .:/workspace

      - esp-idf-build:/workspace/build
      - esp-idf-build-qemu:/workspace/build-qemu
      - esp-idf-managed-components:/workspace/managed_components

      - esp-idf-claude-config:/home/ubuntu/.claude
      - esp-idf-claude-data:/home/ubuntu/.local/share/claude

    environment:
      HOME: /home/ubuntu
      PATH: "/home/ubuntu/.local/bin:${PATH}"
      TERM: xterm-256color

    stdin_open: true
    tty: true

    command: ["bash"]

volumes:
  esp-idf-build:
  esp-idf-build-qemu:
  esp-idf-managed-components:
  esp-idf-claude-config:
  esp-idf-claude-data: